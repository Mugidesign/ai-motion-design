# infra/nginx/auth-proxy.conf
#
# supabase-js (and @supabase/ssr, which wraps it) always calls
# `${NEXT_PUBLIC_SUPABASE_URL}/auth/v1/...` — that `/auth/v1` prefix is
# baked into the SDK, not configurable per-call. The official Supabase
# self-hosted stack satisfies this with Kong, a full API gateway (also
# routing PostgREST, Storage, Realtime, etc.). This project only uses
# GoTrue, so a ~15-line nginx config does the one route Kong would
# otherwise provide, at a fraction of the operational surface. GoTrue
# itself expects unprefixed paths (/token, /signup, /user, ...), hence the
# rewrite below.
#
# Mounted into the nginx container by docker-compose.yml. If you later add
# Storage or Realtime and want the full Supabase stack's conveniences,
# switching to Kong at that point is a reasonable upgrade — this file
# isn't trying to reimplement Kong, just unblock the one thing this
# project needs from it.

server {
    listen 8000;

    location /auth/v1/ {
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass http://gotrue:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        return 200 '{"ok":true}';
        add_header Content-Type application/json;
    }
}
