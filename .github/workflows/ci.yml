name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      # No `cache: pnpm` here: that option requires a pnpm-lock.yaml
      # already committed to hash as a cache key, and this repo doesn't
      # ship one — it was scaffolded in an environment with no network
      # access, so `pnpm install` was never actually run to generate one.
      # Once someone runs `pnpm install` locally and commits the resulting
      # pnpm-lock.yaml, add `cache: pnpm` back here (and switch the
      # install step below to `pnpm install --frozen-lockfile`) for
      # faster, reproducible installs. Until then, plain `pnpm install`
      # resolves and lockfiles fresh on every run.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  # Validates schema.ts is well-formed enough for drizzle-kit to process
  # it. NOTE: this scaffold ships with packages/db/migrations/ empty (see
  # its README.md) — a stricter "fail if `pnpm generate` produces an
  # uncommitted diff" check only makes sense once your team has run
  # `pnpm db:generate` for the first time and committed the result as your
  # real migration baseline. Add that stricter check back in at that
  # point; today it would fail on every run since there's nothing to diff
  # against yet.
  db-schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      # See the comment on the same step in typecheck-and-lint above —
      # no committed lockfile yet, so no `cache: pnpm`.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - name: Verify schema.ts produces a valid migration
        working-directory: packages/db
        run: pnpm generate
