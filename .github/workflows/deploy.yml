name: Deploy Workers

# Deploys the 8 Cloudflare Workers in this repo (5 MCP servers,
# agents-worker, orchestrator, api-gateway) on every push to main.
# apps/web (Next.js) is intentionally NOT deployed here — connect the
# repo to Vercel directly (or your host of choice) for that; mixing a
# Next.js deploy into a Workers-focused Actions file adds more moving
# parts than it saves for most setups.
#
# BEFORE THIS WILL SUCCEED, you need:
#   1. Two repo secrets (Settings -> Secrets and variables -> Actions):
#      CLOUDFLARE_API_TOKEN   — a token with Workers Scripts:Edit permission
#      CLOUDFLARE_ACCOUNT_ID
#      The `check-secrets` job below skips the actual deploy (rather than
#      failing loudly) if these aren't set yet, so an unconfigured repo
#      shows a clean "skipped" instead of a wall of red.
#   2. Every wrangler.jsonc placeholder ID replaced with a real one —
#      `<YOUR_KV_NAMESPACE_ID>` in api-gateway/wrangler.jsonc, etc. Search
#      the repo for `<YOUR_` to find all of them. `wrangler deploy` will
#      fail per-Worker until its own placeholders are filled in, same as
#      it would from your own machine.
#   3. Each Worker's own secrets (DATABASE_URL, SUPABASE_JWT_SECRET,
#      provider API keys, ...) set once via `wrangler secret put` — these
#      persist across deploys and are NOT set through this workflow.
#   4. infra/docker-compose.yml's Postgres reachable from the public
#      internet (not localhost) if DATABASE_URL is meant to point at it
#      from Cloudflare's network — see docs/06-oss-free-stack.md.

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "packages/**"
      - "pnpm-lock.yaml"
  workflow_dispatch: {} # lets you trigger a deploy manually from the Actions tab, e.g. to retry after fixing (2) above without an empty commit

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repo secrets are not set — skipping deploy. Add them under Settings > Secrets and variables > Actions, then re-run this workflow."
          fi

  deploy:
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Order matters for a from-scratch environment (agents-worker must
      # exist before things that service-bind to it) but not for updates
      # to an already-deployed stack, where every Worker already exists —
      # `fail-fast: false` so one Worker's deploy failure doesn't cancel
      # the others mid-run.
      fail-fast: false
      matrix:
        worker:
          - workers/mcp-servers/motion-generator
          - workers/mcp-servers/lead-enrichment
          - workers/mcp-servers/communication
          - workers/mcp-servers/knowledge
          - workers/mcp-servers/crm-finance
          - workers/agents
          - workers/orchestrator
          - workers/api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      # No `cache: pnpm`: this repo doesn't ship a committed
      # pnpm-lock.yaml yet (see the matching comment in ci.yml for why),
      # and that option requires one to already exist to hash as a cache
      # key. Add it back once a real lockfile is committed.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install

      - name: Deploy ${{ matrix.worker }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.worker }}
          command: deploy
